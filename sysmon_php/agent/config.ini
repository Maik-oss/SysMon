[computador]
; "auto" = usa o nome do computador (hostname) automaticamente,
; sem voce precisar digitar nada. So troque se quiser um nome
; diferente do hostname do Windows.
codigo = auto
label = auto

; Numero de patrimonio (6 digitos). Preenchido pelo install.bat. Com ele, o
; computador vira CM + patrimonio no painel (ex.: CM406652) e aparece com a
; sala e o modelo da planilha do campus. Vazio = usa o nome do Windows.
patrimonio =

; Local fisico (opcional, aparece no painel). Este aqui precisa
; ser preenchido a mao mesmo, o Windows nao sabe onde o PC esta.
location =

[servidor]
; O agente envia os dados ao painel por HTTPS (porta 443, a mesma do site).
; Ele NAO acessa mais o banco MySQL, entao nao ha senha de banco neste arquivo.
url = https://projeto2tecnolog2.websiteseguro.com/api/agent_ingest.php
; Chave igual a de includes/agent_config.php no servidor. So serve para
; enviar dados de monitoramento. Nao envie este arquivo para repositorios publicos.
chave = wxbZcO4dN1xNlEBee_Rtm7xYz6zeia61jCZe3ac8zOU

[coleta]
; Intervalo entre coletas, em segundos.
intervalo_segundos = 15
